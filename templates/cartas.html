{% extends "layout.html" %}
<!--
    cartas.html — Card Selection Page

    Extends layout.html via Jinja2 template inheritance.
    This page presents the full shuffled 22-card deck (face-down) in three
    rows. The user clicks cards one by one until they've selected the number
    they chose on the home page (1, 3, or 5).

    Once all cards are picked, the unselected rows fade out and the chosen
    cards are moved into a "stage" area for review. A submit button then
    appears, which POSTs the card data to /results via a dynamically built form.
-->
{% block content %}
<div class="insideCards">

    {% if choosed_cards %}
        <!-- BRANCH 1: LOCKED STATE (User already picked cards) -->
        <div id="selection-stage" class="flex-container stage-{{ selected_cards }}" style="display: flex; flex-grow: 1; align-items: center;">
            {% for card in choosed_cards %}
                <button class="card clicked" 
                        style="background-image: url('{{ card.image }}'); transform: {{ 'rotateX(180deg)' if card.value == 'invertido' else 'rotateY(180deg)' }};">
                </button>
            {% endfor %}
        </div>

        <div class="container-botoes" style="display: flex;">
            <button type="button" class="botao-texto-grande" disabled style="opacity: 0.5; cursor: not-allowed;">
                leitura já iniciada
            </button>
        </div>

    {% else %}
        <!-- BRANCH 2: NORMAL STATE (22 Face-down cards) -->
        <div class="flex-container">
            {% for card in cards_group1 %}
            <button class="card" data-image="{{ card.image }}" data-name="{{ card.name }}" data-value="{{ card.value }}"></button>
            {% endfor %}
        </div>
        <div class="flex-container">
            {% for card in cards_group2 %}
            <button class="card" data-image="{{ card.image }}" data-name="{{ card.name }}" data-value="{{ card.value }}"></button>
            {% endfor %}
        </div>
        <div class="flex-container">
            {% for card in cards_group3 %}
            <button class="card" data-image="{{ card.image }}" data-name="{{ card.name }}" data-value="{{ card.value }}"></button>
            {% endfor %}
        </div>

        <div id="selection-stage" class="flex-container" style="display: none; flex-grow: 1; align-items: center;"></div>

        <div class="container-botoes" style="display: none;">
            <button type="button" class="botao-texto-grande" id="leituraButton">
                vamos fazer a leitura
            </button>
        </div>
    {% endif %}

</div>


<script nonce="{{ csp_nonce() }}">
/*
    nonce="{{ g.nonce }}" — required by the Content Security Policy (CSP).
    Flask generates a unique nonce per request and stores it in 'g'.
    Without it, the CSP would block this inline script from executing.
*/

// PRIVACY GUARD: Check if this is a new tab/window
    (function() {
        if (!sessionStorage.getItem('tab_active')) {
            // Tab was closed and reopened — kill the server session
            fetch('/clear_session', {
                method: 'POST'
            }).then(() => {
                window.location.href = '/';
            });
        } else {
            // Tab is still alive — keep it marked
            sessionStorage.setItem('tab_active', '1');
        }
    })();

document.addEventListener('DOMContentLoaded', function () {

    const cards            = document.querySelectorAll('.card');
    const selectedCardsCount = {{ selected_cards }}; // Jinja2 injects the integer (1, 3, or 5) directly
    let clickedCards       = 0;   // Running count of how many cards the user has picked
    let selectedCardsData  = [];  // Array of { name, value } objects for the chosen cards
    
    // =================================================================
    // RESTORE STATE
    // =================================================================
    const previousCards = {{ choosed_cards | default([]) | tojson }};

    if (previousCards && previousCards.length > 0) {
        // Mark the correct number of clicks as already done
        clickedCards = previousCards.length;
        selectedCardsData = previousCards.map(c => ({ name: c.name, value: c.value }));

        // For each previously chosen card, find its DOM button by name,
        // flip it to its face, mark it clicked, then run the transition.
        previousCards.forEach(cardData => {
            const matchingBtn = Array.from(cards).find(
                btn => btn.getAttribute('data-name') === cardData.name
            );
            if (!matchingBtn) return;

            const imageUrl = matchingBtn.getAttribute('data-image');
            matchingBtn.style.transition = 'none'; // Instant snap, no animation
            matchingBtn.style.backgroundImage = `url("${imageUrl}")`;
            matchingBtn.style.transform = cardData.value === 'invertido'
                ? 'rotateX(180deg)'
                : 'rotateY(180deg)';
            matchingBtn.classList.add('clicked');
        });

        // Jump straight to the stage without animation delay
        performTransition();
        
        // EXIT EARLY: Do not attach click listeners to the remaining cards
        return; 
    }
    // =================================================================

    // ----------------------------------------------------------------
    // 1. CARD CLICK LOGIC
    // Handles the flip animation and tracks which cards have been chosen.
    // ----------------------------------------------------------------
    cards.forEach(card => {
        card.addEventListener('click', () => {

            // Guard: ignore clicks if the card is already selected, currently
            // mid-animation (processing), or the user has already picked enough cards.
            if (
                card.classList.contains('clicked') ||
                card.dataset.processing === "true" ||
                clickedCards >= selectedCardsCount
            ) {
                return;
            }

            // Lock the card immediately to prevent a double-click during animation.
            // Using a data attribute (not a class) so it doesn't affect CSS styling.
            card.dataset.processing = "true";

            const imageUrl         = card.getAttribute('data-image');
            const cardName         = card.getAttribute('data-name');
            const cardValue        = card.getAttribute('data-value'); // "normal" or "invertido"
            const animationDuration = 1000; // milliseconds

            card.style.transition = `transform ${animationDuration}ms ease`;

            // Inverted cards flip on the X axis (upside-down effect).
            // Normal cards flip on the Y axis (standard card reveal).
            if (cardValue === 'invertido') {
                card.style.transform = "rotateX(180deg)";
            } else {
                card.style.transform = "rotateY(180deg)";
            }

            // Wait for the flip to be halfway done, then swap in the card's
            // face image. This creates the illusion of the card turning over.
            setTimeout(() => {
                card.style.backgroundImage = `url("${imageUrl}")`;
                card.classList.add('clicked'); // CSS uses this class to style selected cards

                delete card.dataset.processing; // Release the processing lock

                clickedCards++;
                selectedCardsData.push({ name: cardName, value: cardValue });

                // Once the user has picked all required cards, trigger the
                // stage transition after a short pause for visual breathing room.
                if (clickedCards === selectedCardsCount) {
                    setTimeout(() => {
                        performTransition();
                    }, 500);
                }
            }, animationDuration / 3); // Fire at 1/3 through the flip animation
        });
    });


    // ----------------------------------------------------------------
    // 2. STAGE TRANSITION
    // Fades out the three card rows and moves the chosen cards into the
    // central stage area, applying a layout class based on card count.
    // ----------------------------------------------------------------
    function performTransition() {
        // Target the original rows but NOT the stage itself (it shares the flex-container class)
        const allRows      = document.querySelectorAll('.insideCards > .flex-container:not(#selection-stage)');
        const stage        = document.getElementById('selection-stage');
        const botoes       = document.querySelector('.container-botoes');
        const selectedCards = document.querySelectorAll('.card.clicked');

        // A. Fade out all three card rows, then hide them from the layout entirely.
        allRows.forEach(row => {
            row.style.transition = 'opacity 0.5s ease';
            row.style.opacity = '0';
            setTimeout(() => {
                row.style.display = 'none'; // Removes from layout after fade completes
            }, 500);
        });

        // B. After the fade, move the selected cards into the stage and reveal it.
        setTimeout(() => {
            stage.innerHTML = ''; // Clear any leftover content from a previous visit

            // Reset the stage's classes, then add a count-specific layout class
            // (stage-1, stage-3, or stage-5) so CSS can size cards appropriately.
            stage.className = 'flex-container';
            if (selectedCards.length === 1)      stage.classList.add('stage-1');
            else if (selectedCards.length === 3)  stage.classList.add('stage-3');
            else if (selectedCards.length === 5)  stage.classList.add('stage-5');

            selectedCards.forEach(card => {
                // Reset any inline transform from the original flip animation,
                // then re-apply the correct orientation for display on the stage.
                card.style.transform = 'none';
                const isInverted = card.getAttribute('data-value') === 'invertido';
                card.style.transform = isInverted ? "rotateX(180deg)" : "rotateY(180deg)";

                // appendChild physically moves the DOM node — the card is no longer
                // in its original row, it now lives inside the stage div.
                stage.appendChild(card);
            });

            stage.style.display = 'flex'; // Reveal the stage
            botoes.style.display = 'flex'; // Reveal the submit button

            // Pop-in animation using the Web Animations API for a polished entrance.
            stage.animate([
                { transform: 'scale(0.9)', opacity: 0 },
                { transform: 'scale(1)',   opacity: 1 }
            ], {
                duration: 500,
                easing: 'ease-out'
            });

        }, 500); // Wait for the fade-out to finish before moving cards in
    }


    // ----------------------------------------------------------------
    // 3. SUBMIT LOGIC
    // Builds and submits a form dynamically so we can POST the selected
    // card data (a JSON string) along with a fresh CSRF token.
    //
    // Why build a form in JS instead of having one in the HTML?
    // Because the card data (selectedCardsData) only exists in JavaScript —
    // it's assembled at runtime as the user clicks cards. There's no server-
    // side form to pre-populate, so we construct the form on the fly.
    // ----------------------------------------------------------------
    const leituraButton = document.querySelector('#leituraButton');

    leituraButton.addEventListener('click', function (e) {
        e.preventDefault();

        // LOCK BUTTON ---
        leituraButton.disabled = true;
        leituraButton.innerText = "preparando leitura...";
        leituraButton.style.opacity = "0.5";
        leituraButton.style.cursor = "not-allowed";
        // Lock the state immediately
        sessionStorage.setItem('reading_committed', 'true');

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '{{ url_for("results") }}';

        const dataInput = document.createElement('input');
        dataInput.type = 'hidden';
        dataInput.name = 'selected_cards_data';
        dataInput.value = JSON.stringify(selectedCardsData);
        form.appendChild(dataInput);

        const csrfInput = document.createElement('input');
        csrfInput.type = 'hidden';
        csrfInput.name = 'csrf_token';
        csrfInput.value = '{{ csrf_token() }}';
        form.appendChild(csrfInput);

        document.body.appendChild(form);
        form.submit();
    });
});
// ----------------------------------------------------------------
// 4. BROWSER HISTORY GUARD (Bfcache)
// ----------------------------------------------------------------
window.addEventListener('pageshow', function () {
    const btn = document.getElementById('leituraButton');
    const container = document.querySelector('.container-botoes');

    // If the user clicks "Back" from the results page, lock the button
    if (sessionStorage.getItem('reading_committed') === 'true') {
        if (btn) {
            btn.disabled = true;
            btn.innerText = "leitura já iniciada";
            btn.style.opacity = "0.5";
            btn.style.cursor = "not-allowed";
            btn.style.display = "flex";
        }
        if (container) {
            container.style.display = 'flex';
        }
    }
});
</script>
{% endblock %}
