{% extends "layout.html" %}
<!--
    results.html — Tarot Reading Results Page

    Extends layout.html via Jinja2 template inheritance.
    This page has two responsibilities:
      1. Connect to the server via WebSocket and trigger the AI reading generation,
         then display the result when it arrives.
      2. Provide an optional slide-up chat interface so the user can ask
         follow-up questions about their reading.

    The AI generation is NOT done during the Flask route — it's triggered
    client-side immediately after the page loads via a Socket.IO event.
    This keeps the HTTP response fast and lets us show a loading animation
    while the AI is working.
-->
{% block content %}
<div class="insideResult">

    <!--
        CSRF TOKEN IN A META TAG
        WebSocket events bypass Flask's standard HTTP middleware, so the CSRF
        token can't be validated the usual way. Instead, we embed the token in
        a <meta> tag at render time so JavaScript can read it and include it
        manually in the 'start_generation' Socket.IO event payload.
        The server then calls validate_csrf() explicitly inside the handler.
    -->
    <meta name="csrf-token" content="{{ csrf_token() }}">

    <!-- ----------------------------------------------------------------
         READING DISPLAY AREA
         Shows a loading message while the AI generates the reading.
         Once the 'generation_complete' Socket.IO event fires, the loading
         message is hidden and the result area is revealed.
    ----------------------------------------------------------------- -->
    <div id="content-wrapper" class="content-wrapper">
        <div class="txt-resultado">

            <!-- Loading state: visible by default until the reading arrives. -->
            <p id="loading-message">
                Estamos gerando sua leitura. Por favor, aguarde<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
                <!-- CSS animates these three dots to pulse in sequence. -->
                
            </p>

            <!-- Result state: hidden until the AI response is received. -->
            <div id="result-area" style="display:none;">
                <p id="tarot-reading"></p>
                <!-- Button to open the chat panel for follow-up questions. -->
                <div class="container-botoes">
                    <button id="open-chat" type="button" class="botao-texto-grande">
                        quer conversar mais sobre a leitura?
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!--
        SCROLL SHADOW OVERLAY
        A decorative gradient div that fades in at the bottom of the content
        wrapper when the reading text is taller than the visible area.
        It signals to the user that there is more content to scroll to.
        Controlled entirely by JavaScript (checkContentOverflow).
    -->
    <div id="shadow-overlay" class="shadow-overlay" style="display: none;"></div>

</div>


<!-- ----------------------------------------------------------------
     CHAT INTERFACE
     A slide-up overlay panel for follow-up conversation about the reading.
     Both the overlay backdrop and the panel itself start hidden and are
     revealed together when the user clicks the "open-chat" button.
----------------------------------------------------------------- -->

<!-- Dark backdrop that appears behind the chat panel (click-to-close UX). -->
<div id="chat-overlay" class="chat-overlay" style="display: none;"></div>

<div id="chat-interface" class="chat-interface" style="display: none;">
    <div class="chat-header">
        <h2>Chat sobre a leitura</h2>
        <!-- × close button — hides the panel and backdrop. -->
        <button id="close-chat" class="close-button">&times;</button>
    </div>

    <!-- Scrollable message history. Messages are appended here by addMessage(). -->
    <div id="chat-messages" class="chat-messages"></div>

    <div class="chat-input-area">
        <input type="text" id="user-input" class="chat-input" placeholder="Digite sua mensagem...">
        <button id="send-message" class="chat-send-button">Enviar</button>
    </div>
</div>


<!--
    EXTERNAL LIBRARIES (loaded from CDN)
    socket.io — client library that manages the WebSocket connection,
                handles reconnection, and provides the emit/on API.
    marked     — Markdown parser used to render the AI's Markdown-formatted
                 chat responses as HTML in the chat window.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.18/marked.min.js"></script>

<script>
    // ----------------------------------------------------------------
    // WEBSOCKET SETUP
    // ----------------------------------------------------------------
    const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

    const socket = io({
        transports: ['websocket'],
        upgrade: false,
        reconnection: true,
        reconnectionAttempts: 5,
        reconnectionDelay: 2000,
        reconnectionDelayMax: 10000,
        timeout: 20000
    });

    // ----------------------------------------------------------------
    // DOM REFERENCES
    // ----------------------------------------------------------------
    const contentWrapper    = document.getElementById('content-wrapper');
    const resultArea        = document.getElementById('result-area');
    const shadowOverlay     = document.getElementById('shadow-overlay');
    const chatInterface     = document.getElementById('chat-interface');
    const chatOverlay       = document.getElementById('chat-overlay');
    const openChatButton    = document.getElementById('open-chat');
    const closeChatButton   = document.getElementById('close-chat');
    const chatMessages      = document.getElementById('chat-messages');
    const userInput         = document.getElementById('user-input');
    const sendMessageButton = document.getElementById('send-message');
    const loadingMessage    = document.getElementById('loading-message');

    let tarotReading    = '';
    let isFirstChatOpen = true;

    // ----------------------------------------------------------------
    // STATUS BAR
    // Non-intrusive feedback shown only when something is wrong.
    // ----------------------------------------------------------------
    function showStatus(message, type = 'warning') {
        let statusBar = document.getElementById('connection-status');
        if (!statusBar) {
            statusBar = document.createElement('p');
            statusBar.id = 'connection-status';
            statusBar.style.cssText = `
                font-size: 0.85em;
                margin-top: 12px;
                padding: 8px 16px;
                border-radius: 6px;
                transition: opacity 0.3s ease;
            `;
            loadingMessage.insertAdjacentElement('afterend', statusBar);
        }
        const colors = {
            warning: 'rgba(255, 200, 50, 0.15)',
            error:   'rgba(255, 80, 80, 0.15)',
            success: 'rgba(80, 200, 120, 0.15)'
        };
        statusBar.style.background = colors[type] || colors.warning;
        statusBar.innerText = message;
        statusBar.style.opacity = '1';
    }

    function hideStatus() {
        const statusBar = document.getElementById('connection-status');
        if (statusBar) statusBar.style.opacity = '0';
    }

    // ----------------------------------------------------------------
    // GENERATION REQUEST
    // Called on first connect AND on every reconnect.
    // Server returns cached reading instantly if Gemini already finished.
    // ----------------------------------------------------------------
    function requestReading() {
        if (tarotReading !== '') return; // Already received, do nothing
        socket.emit('start_generation', {
            intencao:       {{ intencao | tojson }},
            selected_cards: "{{ selected_cards }}",
            choosed_cards:  {{ choosed_cards | tojson }},
            csrf_token:     csrfToken
        });
    }

    // ----------------------------------------------------------------
    // SOCKET.IO LIFECYCLE EVENTS
    // ----------------------------------------------------------------
    socket.on('connect', () => {
        hideStatus();
        requestReading();
    });

    socket.on('disconnect', () => {
        if (tarotReading !== '') return;
        showStatus('Conexão perdida. Tentando reconectar...', 'warning');
    });

    socket.io.on('reconnect_attempt', (n) => {
        if (tarotReading !== '') return;
        showStatus(`Reconectando... (tentativa ${n} de 5)`, 'warning');
    });

    socket.io.on('reconnect', () => {
        showStatus('Conexão restaurada! Recuperando leitura...', 'success');
    });

    socket.io.on('reconnect_failed', () => {
        clearTimeout(longWaitTimer);
        hideStatus(); // ← clears "Reconectando... (tentativa 5 de 5)"
        // resultArea stays hidden — we never show it here so the chat button never appears
        loadingMessage.innerHTML = `
            <span style="color: rgba(233, 219, 174, 0.7); font-size: 0.95em;">
                Não foi possível reconectar ao servidor.
            </span>
            <a href="/" style="
                display: inline-block;
                margin-top: 14px;
                padding: 8px 20px;
                background: rgba(125, 107, 46, 0.15);
                border: 1px solid rgba(125, 107, 46, 0.5);
                border-radius: 8px;
                color: #E9DBAE;
                font-family: 'Averia Serif Libre', serif;
                font-size: 0.85em;
                font-weight: 300;
                text-decoration: none;
                transition: background 0.2s ease;
            " onmouseover="this.style.background='rgba(125,107,46,0.3)'"
            onmouseout="this.style.background='rgba(125,107,46,0.15)'">
                tentar novamente
            </a>
        `;
    });

    // ----------------------------------------------------------------
    // GENERATION EVENTS
    // ----------------------------------------------------------------
    socket.on('generation_complete', function(data) {
        clearTimeout(longWaitTimer);
        hideStatus();
        tarotReading = data.reading;
        loadingMessage.style.display = 'none';
        resultArea.style.display = 'block';
        document.getElementById('tarot-reading').innerHTML = data.reading;
        setTimeout(checkContentOverflow, 100);
    });

    socket.on('generation_error', function(data) {
        clearTimeout(longWaitTimer);
        loadingMessage.style.display = 'none';
        resultArea.style.display = 'block';
        document.getElementById('tarot-reading').innerHTML = `
            <p>Erro: ${data.message}</p>
            <p><a href="/" style="text-decoration:underline;">Tentar novamente</a></p>
        `;
    });

    // ----------------------------------------------------------------
    // SOFT TIMEOUT — 2 minutes
    // Doesn't force anything. Offers a reload button if the API is
    // unusually slow. Cleared if reading arrives or retries are exhausted.
    // ----------------------------------------------------------------
    const longWaitTimer = setTimeout(() => {
        if (tarotReading === '') {
            loadingMessage.innerHTML =
                'A IA está demorando mais que o normal.' +
                '<br><button onclick="window.location.reload()" style="' +
                    'margin-top: 14px;' +
                    'padding: 8px 20px;' +
                    'background: rgba(125, 107, 46, 0.15);' +
                    'border: 1px solid rgba(125, 107, 46, 0.5);' +
                    'border-radius: 8px;' +
                    'color: #E9DBAE;' +
                    'font-family: Averia Serif Libre, serif;' +
                    'font-size: 0.85em;' +
                    'font-weight: 300;' +
                    'cursor: pointer;' +
                    'display: block;' +
                    'transition: background 0.2s ease;' +
                '" onmouseover="this.style.background=\'rgba(125,107,46,0.3)\'"' +
                'onmouseout="this.style.background=\'rgba(125,107,46,0.15)\'">' +
                'atualizar página</button>';
        }
    }, 120000);

    // ----------------------------------------------------------------
    // SCROLL SHADOW MANAGEMENT
    // ----------------------------------------------------------------
    function checkContentOverflow() {
        if (contentWrapper.scrollHeight > contentWrapper.clientHeight) {
            shadowOverlay.style.display = 'block';
            setTimeout(() => { shadowOverlay.style.opacity = '1'; }, 10);
        } else {
            shadowOverlay.style.opacity = '0';
        }
    }

    contentWrapper.addEventListener('scroll', function() {
        const threshold = 30;
        const atBottom  = contentWrapper.scrollTop + contentWrapper.clientHeight
                          >= contentWrapper.scrollHeight - threshold;
        if (atBottom) {
            shadowOverlay.style.opacity = '0';
        } else if (contentWrapper.scrollHeight > contentWrapper.clientHeight) {
            shadowOverlay.style.opacity = '1';
        }
    });

    window.addEventListener('resize', checkContentOverflow);

    // ----------------------------------------------------------------
    // CHAT PANEL — OPEN / CLOSE
    // ----------------------------------------------------------------
    openChatButton.addEventListener('click', () => {
        chatInterface.style.display = 'flex';
        chatOverlay.style.display   = 'block';
        if (isFirstChatOpen) {
            addMessage('bot', 'Olá, vamos conversar mais sobre sua leitura, o que você quer saber?');
            isFirstChatOpen = false;
        }
    });

    closeChatButton.addEventListener('click', () => {
        chatInterface.style.display = 'none';
        chatOverlay.style.display   = 'none';
    });

    // ----------------------------------------------------------------
    // CHAT — SEND MESSAGE
    // ----------------------------------------------------------------
    sendMessageButton.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
        const message = userInput.value.trim();
        if (message) {
            addMessage('user', message);
            showLoadingIndicator();
            socket.emit('send_message', { message: message, tarot_reading: tarotReading });
            userInput.value = '';
        }
    }

    socket.on('receive_message', (data) => {
        removeLoadingIndicator();
        addMessage('bot', data.message);
    });

    // ----------------------------------------------------------------
    // CHAT UI HELPERS
    // ----------------------------------------------------------------
    function showLoadingIndicator() {
        const loadingDiv = document.createElement('div');
        loadingDiv.classList.add('chat-message', 'bot-message');
        loadingDiv.innerHTML = `
            <div class="chat-message-content">
                <span class="loading-dots">.<span>.</span><span>.</span><span>.</span></span>
            </div>`;
        chatMessages.appendChild(loadingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeLoadingIndicator() {
        const last = chatMessages.querySelector('.chat-message:last-child');
        if (last && last.querySelector('.loading-dots')) last.remove();
    }

    function addMessage(sender, content) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('chat-message', sender === 'user' ? 'user-message' : 'bot-message');
        if (sender === 'bot') content = marked.parse(content);
        messageDiv.innerHTML = `<div class="chat-message-content">${content}</div>`;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // ----------------------------------------------------------------
    // MOBILE KEYBOARD FOCUS MODE
    // ----------------------------------------------------------------
    function isTouchDevice() {
        return window.location.hostname !== 'localhost' &&
               window.matchMedia("(hover: none) and (pointer: coarse)").matches;
    }

    userInput.addEventListener('focus', () => {
        if (isTouchDevice()) {
            chatInterface.classList.add('chat-focus-mode');
            setTimeout(() => {
                chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });
            }, 300);
        }
    });

    userInput.addEventListener('blur', () => {
        setTimeout(() => {
            chatInterface.classList.remove('chat-focus-mode');
        }, 200);
    });

</script>
{% endblock %}
