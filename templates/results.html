{% extends "layout.html" %}

{% block content %}
<div class="insideResult">
    <!-- FIX 1: Add the CSRF Token to the DOM so JS can read it -->
    <meta name="csrf-token" content="{{ csrf_token() }}">

    <div id="content-wrapper" class="content-wrapper">
        <div class="txt-resultado">
            <p id="loading-message">
                Estamos gerando sua leitura. Por favor, aguarde
                <span class="loading-dots">
                    <span>.</span><span>.</span><span>.</span>
                </span>
            </p>
            <div id="result-area" style="display:none;">
                <p id="tarot-reading"></p>
                <div class="container-botoes">
                    <button id="open-chat" type="button" class="botao-texto-grande">
                        quer conversar mais sobre a leitura?
                    </button>
                </div>
                <!-- <div class="spacer"></div> -->
            </div>
        </div>
    </div>
    <div id="shadow-overlay" class="shadow-overlay" style="display: none;"></div>
    <!-- <div id="scroll-indicator" class="scroll-indicator" style="display: none;">
        <span>&#x2193;</span>
    </div> -->
</div>

<div id="chat-overlay" class="chat-overlay" style="display: none;"></div>

<div id="chat-interface" class="chat-interface" style="display: none;">
    <div class="chat-header">
        <h2>Chat sobre a leitura</h2>
        <button id="close-chat" class="close-button">&times;</button>
    </div>
    <div id="chat-messages" class="chat-messages">
        <!-- Messages will be added here dynamically -->
    </div>
    <div class="chat-input-area">
        <input type="text" id="user-input" class="chat-input" placeholder="Digite sua mensagem...">
        <button id="send-message" class="chat-send-button">Enviar</button>
    </div>
</div>

<!-- Incluindo o script do Socket.IO -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.18/marked.min.js"></script>
<script>
    // FIX 2: Remove the getCookie function, we don't need it anymore.
    
    // FIX 3: Get the token from the meta tag we added above IN PRODUCTION
    // const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
    // const socket = io({
    //     transports: ['websocket'], // Force WebSocket, disable polling
    //     upgrade: false
    // });

    // FIX 3: Get the token from the meta tag we added above IN TEST
    // const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
    //     const socket = io('http://localhost:5000', { // <--- Explicitly point to Flask Port
    //     transports: ['websocket'], 
    //     upgrade: false,
    //     cors: { origin: '*' } // Ensure CORS doesn't block it
    // });

    const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
    
    // CORRECT SETUP: Leave the URL empty!
    const socket = io({ 
        transports: ['websocket'], 
        upgrade: false
        // You don't need 'cors' here, that is a server-side config
    });

    const contentWrapper = document.getElementById('content-wrapper');
    const resultArea = document.getElementById('result-area');
    const shadowOverlay = document.getElementById('shadow-overlay');
    const scrollIndicator = document.getElementById('scroll-indicator');
    const chatInterface = document.getElementById('chat-interface');
    const chatOverlay = document.getElementById('chat-overlay');
    const openChatButton = document.getElementById('open-chat');
    const closeChatButton = document.getElementById('close-chat');
    const chatMessages = document.getElementById('chat-messages');
    const userInput = document.getElementById('user-input');
    const sendMessageButton = document.getElementById('send-message');
    let tarotReading = '';
    let isFirstChatOpen = true;

    // FIX 4: Send the token retrieved from the DOM
    socket.emit('start_generation', {
        intencao: "{{ intencao }}",
        selected_cards: "{{ selected_cards }}",
        choosed_cards: {{ choosed_cards | tojson }},
        csrf_token: csrfToken // <--- Using the variable from the meta tag
    });

    socket.on('generation_error', function (data) {
        console.error("CSRF Error:", data.message);
        document.getElementById('loading-message').innerText = "Erro: " + data.message + ". Por favor recarregue a página.";
    });

    socket.on('generation_complete', function(data) {
        document.getElementById('loading-message').style.display = 'none';
        resultArea.style.display = 'block';
        document.getElementById('tarot-reading').innerHTML = data.reading;
        tarotReading = data.reading;
        
        setTimeout(checkContentOverflow, 100);
    });

    function checkContentOverflow() {
        // If content is taller than the wrapper, show the shadow
        if (contentWrapper.scrollHeight > contentWrapper.clientHeight) {
            shadowOverlay.style.display = 'block';
            // Use a tiny timeout to allow 'display: block' to register before changing opacity
            setTimeout(() => { shadowOverlay.style.opacity = '1'; }, 10);
        } else {
            shadowOverlay.style.opacity = '0';
        }
    }

    function showScrollIndicators() {
        shadowOverlay.style.display = 'block';
        scrollIndicator.style.display = 'block';
    }

    function hideScrollIndicators() {
        shadowOverlay.style.display = 'none';
        scrollIndicator.style.display = 'none';
    }

    function isAtBottom() {
        const scrollTop = contentWrapper.scrollTop;
        const scrollHeight = contentWrapper.scrollHeight;
        const clientHeight = contentWrapper.clientHeight;
        // Tolerance of 20px so it fades out just before hitting the bottom
        return scrollTop + clientHeight >= scrollHeight - 20; 
    }

    contentWrapper.addEventListener('scroll', function() {
        const threshold = 30; // pixels from the bottom
        const isAtBottom = contentWrapper.scrollTop + contentWrapper.clientHeight >= contentWrapper.scrollHeight - threshold;
        
        if (isAtBottom) {
            shadowOverlay.style.opacity = '0';
        } else if (contentWrapper.scrollHeight > contentWrapper.clientHeight) {
            shadowOverlay.style.opacity = '1';
        }
    });

    window.addEventListener('resize', checkContentOverflow);

    openChatButton.addEventListener('click', () => {
        chatInterface.style.display = 'flex';
        chatOverlay.style.display = 'block';
        
        if (isFirstChatOpen) {
            addMessage('bot', 'Olá, vamos conversar mais sobre sua leitura, o que você quer saber?');
            isFirstChatOpen = false;
        }
    });

    closeChatButton.addEventListener('click', () => {
        chatInterface.style.display = 'none';
        chatOverlay.style.display = 'none';
    });

    sendMessageButton.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // function sendMessage() {
    //     const message = userInput.value.trim();
    //     if (message) {
    //         addMessage('user', message);
    //         showLoadingIndicator();
    //         socket.emit('send_message', { message: message, tarot_reading: tarotReading });
    //         userInput.value = '';
    //     }
    // }

    function sendMessage() {
        const message = userInput.value.trim();
        if (message) {
            addMessage('user', message);
            showLoadingIndicator();
            socket.emit('send_message', { message: message, tarot_reading: tarotReading });
            userInput.value = '';
            
            // Optional: Uncomment the next line to close keyboard after sending
            // userInput.blur();  
        }
    }


    socket.on('receive_message', (data) => {
        removeLoadingIndicator();
        addMessage('bot', data.message);
    });

    function showLoadingIndicator() {
        const loadingDiv = document.createElement('div');
        loadingDiv.classList.add('chat-message', 'bot-message');
        loadingDiv.innerHTML = `
            <div class="chat-message-content">
                <span class="loading-dots">
                    .<span>.</span><span>.</span><span>.</span>
                </span>
            </div>
        `;
        chatMessages.appendChild(loadingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeLoadingIndicator() {
        const loadingIndicator = chatMessages.querySelector('.chat-message:last-child');
        if (loadingIndicator && loadingIndicator.querySelector('.loading-dots')) {
            loadingIndicator.remove();
        }
    }

    function addMessage(sender, content) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('chat-message', sender === 'user' ? 'user-message' : 'bot-message');
        
        // Parse markdown for bot messages
        if (sender === 'bot') {
            content = marked.parse(content);
        }
        
        messageDiv.innerHTML = `<div class="chat-message-content">${content}</div>`;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    
    // --- CHAT FOCUS MODE LOGIC ---
  

    // function isTouchDevice() {
    //     return window.matchMedia("(hover: none) and (pointer: coarse)").matches;
    // }

    // chatInput.addEventListener('focus', () => {
    //     if (isTouchDevice()) {
    //         chatInterface.classList.add('chat-focus-mode');
    //         // Scroll to bottom of messages to see the last response for context
    //         chatMessages.scrollTop = chatMessages.scrollHeight;
    //     }
    // });

    // chatInput.addEventListener('blur', () => {
    //     chatInterface.classList.remove('chat-focus-mode');
    // });

    function isTouchDevice() {
        return window.location.hostname !== 'localhost' && window.matchMedia("(hover: none) and (pointer: coarse)").matches;
    }

    // Use 'userInput' (which you already have) instead of 'chatInput'
    userInput.addEventListener('focus', () => {
        if (isTouchDevice()) {
            chatInterface.classList.add('chat-focus-mode');
            // Wait for the CSS "shrink" to happen, then scroll to bottom
            setTimeout(() => {
                chatMessages.scrollTo({
                    top: chatMessages.scrollHeight,
                    behavior: 'smooth'
                });
            }, 300);
        }
    });

    userInput.addEventListener('blur', () => {
        // We use a small timeout so the 'click' event on the 
        // Send button has time to fire before the layout jumps.
        setTimeout(() => {
            chatInterface.classList.remove('chat-focus-mode');
        }, 200); 
    });

</script> 
{% endblock %}
